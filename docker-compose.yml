name: smart-logistics-rates

x-app-env: &app-env
  env_file:
    - path: .env.example
    - path: .env
      required: false
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"

x-airflow: &airflow
  build:
    context: .
    dockerfile: docker/airflow/Dockerfile
  profiles: ["airflow"]
  env_file:
    - path: .env.example
    - path: .env
      required: false
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
  volumes:
    - airflow-logs:/opt/airflow/logs
  depends_on:
    postgres:
      condition: service_healthy

x-superset: &superset
  build:
    context: .
    dockerfile: docker/superset/Dockerfile
  profiles: ["superset"]
  env_file:
    - path: .env.example
    - path: .env
      required: false
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
  volumes:
    - superset-home:/app/superset_home

services:
  postgres:
    image: postgres:17
    <<: *app-env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ./sql:/sql:ro
    ports:
      - "${PG_HOST_PORT:-5432}:5432"
    healthcheck:
      # Во время initdb сервер слушает только unix-сокет, поэтому TCP-проверка
      # становится зелёной только после полной генерации источника.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${SOURCE_DB}"]
      interval: 5s
      timeout: 5s
      retries: 120
      start_period: 600s

  pipeline:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    <<: *app-env
    depends_on:
      postgres:
        condition: service_healthy
    command: ["bash", "scripts/run_all.sh"]
    restart: "no"

  tests:
    build:
      context: .
      dockerfile: docker/app/Dockerfile
    <<: *app-env
    profiles: ["test"]
    depends_on:
      postgres:
        condition: service_healthy
    command: ["pytest", "-q"]

  airflow-init:
    <<: *airflow
    command:
      - bash
      - -c
      - |
        set -e
        airflow db migrate
        if ! airflow users list | grep -qw "$${AIRFLOW_ADMIN_USER}"; then
          airflow users create --role Admin --username "$${AIRFLOW_ADMIN_USER}" --password "$${AIRFLOW_ADMIN_PASSWORD}" \
            --firstname Admin --lastname Airflow --email admin@example.com
        fi
    restart: "no"

  airflow-webserver:
    <<: *airflow
    command: webserver
    ports:
      - "${AIRFLOW_HOST_PORT:-8080}:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # --- Бонус: Apache Superset (docker compose --profile superset up -d superset) ---
  superset-init:
    <<: *superset
    command: ["bash", "/app/docker/superset-init.sh"]
    depends_on:
      pipeline:
        condition: service_completed_successfully  # датасеты строятся поверх готовых витрин
    restart: "no"

  superset:
    <<: *superset
    command: ["/usr/bin/run-server.sh"]
    ports:
      - "${SUPERSET_HOST_PORT:-8088}:8088"
    depends_on:
      superset-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8088/health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped

volumes:
  pgdata:
  airflow-logs:
  superset-home:
